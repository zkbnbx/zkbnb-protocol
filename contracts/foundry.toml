[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./poseidon" },
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "./deployments" },
  # privacy stage 2 (DeployPrivacy.s.sol): claimGas, and the chain-56 dev-key refusal
  { access = "read", path = "./gas-v2.json" },
  { access = "read", path = "./src/verifiers" },
]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"
